<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>株式会社TOTAK</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #f4f6f9;
  color: #333;
}

header {
  display: flex;
  align-items: center;
  padding: 20px 40px;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.logo {
  height: 45px;
  margin-right: 15px;
}

.company-name {
  font-size: 22px;
  font-weight: bold;
  color: #1a4fa3;
}

.hero {
  padding: 80px 40px;
  text-align: center;
  background: linear-gradient(to right, #1a4fa3, #2d6cdf);
  color: white;
}

.hero h1 {
  font-size: 36px;
  margin-bottom: 20px;
}

.hero p {
  font-size: 18px;
  opacity: 0.9;
}

.section {
  padding: 60px 40px;
  max-width: 900px;
  margin: auto;
}

.section h2 {
  color: #1a4fa3;
  margin-bottom: 20px;
}

.footer {
  text-align: center;
  padding: 30px;
  background: #1a4fa3;
  color: white;
  font-size: 14px;
}
</style>

</head>
<body>

<header>
  <img src="logo.png" alt="株式会社TOTAK ロゴ" class="logo">
  <div class="company-name">株式会社TOTAK</div>
</header>

<section class="hero">
  <h1>人と企業を、最適につなぐ。</h1>
  <p>総合人材派遣・人材管理ソリューション</p>
</section>

<section class="section">
  <h2>企業概要</h2>
  <p>
    株式会社TOTAKは、全国の物流・製造・事務分野を中心に
    人材派遣および業務支援を行う総合人材サービス企業です。
  </p>
</section>

<section class="section">
  <h2>事業内容</h2>
  <ul>
    <li>一般労働者派遣事業</li>
    <li>業務請負事業</li>
    <li>人材適性評価・再配置支援</li>
  </ul>
</section>

<footer class="footer">
  © 2025 TOTAK Co., Ltd. All Rights Reserved.
</footer>

</body>
</html>
