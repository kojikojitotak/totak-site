<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>株式会社TOTAK</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #f4f6f9;
  color: #333;
}

/* ===== ヘッダー ===== */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 40px;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.left-header {
  display: flex;
  align-items: center;
}

.logo {
  height: 40px;
  margin-right: 15px;
}

.company-name {
  font-size: 20px;
  font-weight: bold;
  color: #1a4fa3;
}

/* ===== 検索エリア ===== */
.search-box input {
  padding: 8px;
  font-size: 14px;
}

.search-box button {
  padding: 8px 12px;
  font-size: 14px;
  background: #1a4fa3;
  color: white;
  border: none;
  cursor: pointer;
}

.search-box button:hover {
  background: #163f85;
}

/* ===== ヒーロー ===== */
.hero {
  padding: 80px 40px;
  text-align: center;
  background: linear-gradient(to right, #1a4fa3, #2d6cdf);
  color: white;
}

.hero h1 {
  font-size: 34px;
  margin-bottom: 20px;
}

.hero p {
  font-size: 18px;
}

/* ===== セクション ===== */
.section {
  padding: 60px 40px;
  max-width: 900px;
  margin: auto;
}

.section h2 {
  color: #1a4fa3;
  margin-bottom: 20px;
}

.footer {
  text-align: center;
  padding: 30px;
  background: #1a4fa3;
  color: white;
  font-size: 14px;
}
</style>

<script>
function searchEmployee() {
  const id = document.getElementById("empId").value.trim();
  if (id === "") return;

  window.location.href = id + ".html";
}
</script>

</head>
<body>

<header>
  <div class="left-header">
    <img src="logo.png" alt="株式会社TOTAK ロゴ" class="logo">
    <div class="company-name">株式会社TOTAK</div>
  </div>

  <div class="search-box">
    <input type="text" id="empId" placeholder="従業員番号を入力">
    <button onclick="searchEmployee()">検索</button>
  </div>
</header>

<section class="hero">
  <h1>人と企業を、最適につなぐ。</h1>
  <p>総合人材派遣・人材管理ソリューション</p>
</section>

<section class="section">
  <h2>企業概要</h2>
  <p>
    株式会社TOTAKは、全国の物流・製造・事務分野を中心に
    人材派遣および業務支援を行う総合人材サービス企業です。
  </p>
</section>

<section class="section">
  <h2>事業内容</h2>
  <ul>
    <li>一般労働者派遣事業</li>
    <li>業務請負事業</li>
    <li>人材適性評価・再配置支援</li>
  </ul>
</section>

<section class="section">
  <h2>ニュース</h2>
  <ul>
    <li>20XX/XX/XX　従業員情報を更新しました。</li>
    <li>※サイト管理者はサイト内の従業員番号から105をただちに削除しておくこと</li>
  </ul>
</section>
<footer class="footer">
  © 2025 TOTAK Co., Ltd. All Rights Reserved.
</footer>

</body>
</html>
