<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>株式会社totak｜公式サイト</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  background: #f4f6f8;
}
header {
  background: #1f2a44;
  color: white;
  padding: 20px 40px;
}
.container {
  max-width: 900px;
  margin: auto;
  padding: 40px;
  background: white;
}
h2 { border-bottom: 1px solid #ddd; padding-bottom: 5px; }

input, button {
  padding: 10px;
  font-size: 16px;
}

footer {
  text-align: center;
  padding: 20px;
  color: #666;
  font-size: 12px;
}
</style>
</head>
<body>

<header>
<h1>株式会社totak</h1>
<p>人と現場を、正確につなぐ。</p>
</header>

<div class="container">

<h2>会社概要</h2>
<p>
株式会社totakは、各業界へ高品質な人材を提供する総合人材派遣企業です。
効率的な人員配置と徹底した管理体制により、
安定したサービスを実現しています。
</p>

<h2>事業内容</h2>
<ul>
<li>人材派遣サービス</li>
<li>現場最適化コンサルティング</li>
<li>人材管理システム運用</li>
</ul>

<h2>スタッフ番号検索</h2>
<p>登録スタッフの勤務状況を確認できます。</p>

<input type="text" id="staffId" placeholder="番号を入力">
<button onclick="search()">検索</button>

<p id="result"></p>

<p style="font-size:12px;color:#777;margin-top:30px;">
※ 一部のスタッフ情報は社内規定により制限されています。
</p>

</div>

<footer>
© totak Co., Ltd.
</footer>

<script>
function search() {
  const id = document.getElementById("staffId").value.trim();
  const valid = ["101","102","103","104","105","106"];

  if (valid.includes(id)) {
    window.location.href = id + ".html";
  } else if (id === "") {
    document.getElementById("result").textContent = "番号を入力してください。";
  } else {
    document.getElementById("result").textContent =
      "該当するスタッフが見つかりません。";
  }
}
</script>

</body>
</html>
